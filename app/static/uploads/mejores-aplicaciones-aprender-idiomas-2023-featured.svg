<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0c1a30;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a30" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <circle cx="1050" cy="150" r="280" fill="#10b981" opacity="0.12" filter="blur(60px)" />
  <circle cx="150" cy="550" r="220" fill="#34d399" opacity="0.08" filter="blur(60px)" />
  
  <g transform="translate(100, 180)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="rgba(99,102,241,0.15)" stroke="rgba(129,140,248,0.3)" stroke-width="1" />
    <text x="80" y="22" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">TRENDBLOGO</text>
    
    <!-- Subtitle / Tag -->
    <text x="180" y="22" fill="rgba(255,255,255,0.5)" font-size="13" font-weight="600" letter-spacing="1">EDITORIAL FEATURED GUIDE</text>
    
    <!-- Main Headline -->
    <text x="0" y="110" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1">Mejores Aplicaciones Aprender Idiomas 2023</text>
    <text x="0" y="170" fill="rgba(255,255,255,0.7)" font-size="22" font-weight="400">Expert Reviews, Buying Insights &amp; Comprehensive Comparisons</text>
    
    <!-- Accent Bar -->
    <rect x="0" y="220" width="120" height="6" rx="3" fill="url(#acc)" />
  </g>
  
  <!-- Footer metadata -->
  <text x="100" y="590" fill="rgba(255,255,255,0.4)" font-size="14" font-family="monospace">trendblogo.com • Verified Editorial Review</text>
</svg>